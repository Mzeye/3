<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Liu+Jian+Mao+Cao&family=Long+Cang&family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
/* ============================================================
   MEMOIR (文学回忆录) STYLES — default :root variables
   ============================================================ */
:root {
  --color-paper:      #fbf9f3;
  --color-surface:    #fffefb;
  --color-ink:        #1f1a14;
  --color-ink-soft:   #5c5347;
  --color-ink-faint:  #9c9282;
  --color-accent:     #8b3a3a;
  --color-accent-dim: #6b2d2d;
  --color-rule:       #d4c9b5;
  --color-rule-light: #e8e2d5;
  --color-overlay:    rgba(20, 16, 10, 0.78);
  --color-danger:     #b55a5a;
  --color-danger-dim: #8b3a3a;
  --font-serif:       'Cormorant Garamond', 'Noto Serif SC', 'STSong', Georgia, 'Times New Roman', serif;
  --font-cjk:         'Noto Serif SC', 'STSong', 'Songti SC', serif;
  --max-width:        680px;
  --pad-page:         2rem;
  --pad-card-v:       1.75rem;
  --pad-card-h:       2rem;
  --ease-out:         cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-in:          cubic-bezier(0.55, 0.06, 0.68, 0.19);
  --dur-fast:         180ms;
  --dur-normal:       280ms;
  --dur-slow:         420ms;
}

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.125rem;
  line-height: 1.8;
  color: var(--color-ink);
  background-color: var(--color-paper);
  min-height: 100vh;
  padding: 0 var(--pad-page) 6rem;
  position: relative;
  transition: background-color 0.5s, color 0.5s;
}

/* Paper texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.003) 2px,
      rgba(0, 0, 0, 0.003) 4px
    );
}

/* ========== MEMOIR VIEW ========== */
#memoirView { display: block; }

/* ---------- Site Header ---------- */
.site-header { text-align: center; padding: 4.5rem 0 1.5rem; user-select: none; }
.site-title {
  font-family: var(--font-serif); font-weight: 300; font-size: 1.3rem;
  letter-spacing: 0.18em; color: var(--color-ink); line-height: 1.2;
}
.site-subtitle {
  font-family: var(--font-serif); font-weight: 300; font-style: italic;
  font-size: 0.75rem; color: var(--color-ink-faint); letter-spacing: 0.08em; margin-top: 0.5rem;
}

/* ---------- Toolbar ---------- */
.toolbar { max-width: var(--max-width); margin: 0 auto 2.5rem; padding: 0; }
.search-wrapper { position: relative; }
.search-input {
  width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem;
  font-family: var(--font-serif); font-weight: 300; font-size: 0.95rem;
  color: var(--color-ink); background: transparent; border: none;
  border-bottom: 1px solid var(--color-rule); border-radius: 0; outline: none;
  transition: border-color var(--dur-normal) var(--ease-out);
}
.search-input::placeholder { color: var(--color-ink-faint); font-style: italic; }
.search-input:focus { border-bottom-color: var(--color-accent); }
.search-wrapper::before {
  content: '\2315'; position: absolute; left: 0.25rem; top: 50%;
  transform: translateY(-60%); font-size: 1.1rem; color: var(--color-ink-faint); pointer-events: none;
}

/* ---------- Essay List ---------- */
.essay-list { max-width: var(--max-width); margin: 0 auto; }

.essay-entry {
  padding: var(--pad-card-v) var(--pad-card-h);
  border-bottom: 1px solid var(--color-rule-light);
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out),
              padding-left var(--dur-fast) var(--ease-out);
  animation: fadeSlideIn var(--dur-slow) var(--ease-out) both;
  position: relative;
}
.essay-entry:hover { background-color: var(--color-surface); padding-left: calc(var(--pad-card-h) + 8px); }
.essay-entry:first-child { border-top: 1px solid var(--color-rule-light); }
.essay-entry-title {
  font-family: var(--font-serif); font-weight: 500; font-size: 1.25rem;
  color: var(--color-ink); line-height: 1.5; margin-bottom: 0.25rem;
  transition: color var(--dur-fast) var(--ease-out);
}
.essay-entry:hover .essay-entry-title { color: var(--color-accent); }
.essay-entry-title.untitled { font-style: italic; color: var(--color-ink-faint); font-weight: 300; }
.essay-entry-excerpt {
  font-family: var(--font-cjk), var(--font-serif); font-weight: 300;
  font-size: 0.95rem; line-height: 1.7; color: var(--color-ink-soft);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; margin-bottom: 0.5rem;
}

/* ---------- Empty State (Memoir) ---------- */
.empty-state {
  max-width: var(--max-width); margin: 3rem auto 0; text-align: center;
  padding: 3rem 2rem; animation: fadeIn var(--dur-slow) var(--ease-out);
}
.empty-quote {
  font-family: var(--font-serif); font-weight: 300; font-style: italic;
  font-size: 1.25rem; line-height: 1.8; color: var(--color-ink-soft);
  margin-bottom: 1.5rem; border: none; padding: 0;
}
.empty-quote p { margin-bottom: 0.75rem; }
.empty-quote footer { font-size: 0.95rem; color: var(--color-ink-faint); font-style: italic; }
.empty-hint {
  font-family: var(--font-cjk), var(--font-serif); font-weight: 300;
  font-size: 1rem; color: var(--color-ink-faint);
}

/* ---------- FAB ---------- */
.fab {
  position: fixed; bottom: 2.5rem; right: 2.5rem;
  width: 56px; height: 56px; border-radius: 50%; border: none;
  background: var(--color-accent); color: #fffefb; font-size: 1.5rem;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(139, 58, 58, 0.25);
  transition: transform var(--dur-fast) var(--ease-out),
              box-shadow var(--dur-fast) var(--ease-out),
              background-color var(--dur-fast) var(--ease-out);
  z-index: 50;
  display: flex; align-items: center; justify-content: center;
  user-select: none; line-height: 1; font-weight: 300;
}
.fab:hover { transform: scale(1.06); background: var(--color-accent-dim); box-shadow: 0 4px 20px rgba(139, 58, 58, 0.35); }
.fab:active { transform: scale(0.96); transition: transform 80ms var(--ease-in); }
.fab-icon { line-height: 1; font-weight: 300; font-size: 1.75rem; }

/* ---------- Switch Button ---------- */
.fab-switch {
  position: fixed; bottom: 2.5rem; right: 7rem;
  width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--color-rule);
  background: var(--color-surface); color: var(--color-ink-soft);
  font-size: 1rem; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  transition: all var(--dur-fast) var(--ease-out);
  z-index: 50;
  display: flex; align-items: center; justify-content: center;
  user-select: none; font-family: var(--font-cjk);
}
.fab-switch:hover {
  border-color: var(--color-accent); color: var(--color-accent);
  box-shadow: 0 4px 16px rgba(139, 58, 58, 0.15);
  transform: scale(1.06);
}
.fab-switch:active { transform: scale(0.96); }

/* ---------- Overlay ---------- */
.overlay {
  position: fixed; inset: 0; background: var(--color-overlay);
  z-index: 100; opacity: 0; pointer-events: none;
  transition: opacity var(--dur-normal) var(--ease-out);
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
}
.overlay.active { opacity: 1; pointer-events: auto; }

/* ---------- Modal Base ---------- */
.modal {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-normal) var(--ease-out);
}
.modal.active { opacity: 1; pointer-events: auto; }
.modal-content {
  background: var(--color-surface); border-radius: 6px;
  box-shadow: 0 8px 40px rgba(20, 16, 10, 0.15);
  position: relative;
  transform: translateY(18px);
  transition: transform var(--dur-normal) var(--ease-out);
  overflow-y: auto; max-height: 92vh;
  scrollbar-width: thin; scrollbar-color: var(--color-rule) var(--color-surface);
  overscroll-behavior: contain;
}
.modal.active .modal-content { transform: translateY(0); }

/* ---------- Writing Modal ---------- */
.modal-writing .modal-content { width: 90vw; max-width: 740px; padding: 0; border-radius: 6px; }
.modal-writing .reading-topbar { position: sticky; top: 0; z-index: 10; }
.writing-body { padding: 1.5rem 3rem 0; }
.writing-title-input {
  display: block; width: 100%; font-family: var(--font-serif); font-weight: 500;
  font-size: 1.65rem; line-height: 1.4; color: var(--color-ink);
  background: transparent; border: none; outline: none; padding: 0; margin-bottom: 1.25rem;
}
.writing-title-input::placeholder { color: var(--color-ink-faint); font-style: italic; font-weight: 300; }
.writing-content-input {
  display: block; width: 100%; min-height: 340px;
  font-family: var(--font-cjk), var(--font-serif); font-weight: 300;
  font-size: 1.05rem; line-height: 1.85; color: var(--color-ink);
  background: transparent; border: none; outline: none; resize: vertical; padding: 0;
}
.writing-content-input::placeholder { color: var(--color-ink-faint); font-style: italic; }
.writing-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.25rem 3rem 1.5rem; border-top: 1px solid var(--color-rule-light); margin-top: 1rem;
}
.writing-meta {
  display: flex; align-items: center; gap: 0.35rem;
  font-family: var(--font-serif); font-weight: 300; font-style: italic;
  font-size: 0.85rem; color: var(--color-ink-faint);
}
.writing-meta .meta-sep { font-style: normal; color: var(--color-rule); }

.btn-save {
  font-family: var(--font-serif); font-weight: 400; font-size: 0.95rem;
  color: var(--color-accent); background: none; border: 1px solid var(--color-accent);
  padding: 0.45rem 1.75rem; border-radius: 2px; cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  letter-spacing: 0.04em;
}
.btn-save:hover { background: var(--color-accent); color: #fffefb; }
.btn-save:active { transform: scale(0.97); }

/* ---------- Reading Modal ---------- */
.modal-reading .modal-content { width: 90vw; max-width: 720px; padding: 0; border-radius: 6px; }
.reading-topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center;
  padding: calc(0.75rem + env(safe-area-inset-top, 0px)) 1rem 0.75rem;
  background: var(--color-surface); border-bottom: 1px solid var(--color-rule-light);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
}
.modal-close-bar {
  display: flex; align-items: center; gap: 0.4rem;
  font-family: var(--font-serif); font-size: 0.95rem; color: var(--color-ink-soft);
  background: none; border: none; cursor: pointer;
  padding: 0.5rem 0.75rem; margin: -0.25rem 0;
  transition: color var(--dur-fast) var(--ease-out);
  line-height: 1; min-height: 44px; min-width: 44px;
}
.modal-close-bar:hover { color: var(--color-ink); }
.close-arrow { font-size: 1.1rem; line-height: 1; }
.close-label { font-weight: 400; letter-spacing: 0.04em; }
.reading-article { padding: 2rem 3rem 1rem; }
.reading-header { margin-bottom: 2rem; }
.reading-title {
  font-family: var(--font-serif); font-weight: 400; font-size: 2rem;
  line-height: 1.3; color: var(--color-ink); margin-bottom: 0.5rem;
}
.ornamental-rule {
  border: none; height: 1px; background: var(--color-rule);
  margin: 1.5rem 0 2rem; position: relative; overflow: visible;
}
.ornamental-rule::after {
  content: '\00A7'; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%); background: var(--color-surface);
  padding: 0 0.75rem; font-size: 0.85rem; color: var(--color-rule); font-weight: 300;
}
.reading-body {
  font-family: var(--font-cjk), var(--font-serif); font-weight: 300;
  font-size: 1.1rem; line-height: 1.9; color: var(--color-ink);
  white-space: pre-wrap; word-break: break-word;
}
.modal-content::-webkit-scrollbar { width: 6px; }
.modal-content::-webkit-scrollbar-track { background: var(--color-surface); }
.modal-content::-webkit-scrollbar-thumb { background: var(--color-rule); border-radius: 3px; }
.modal-content::-webkit-scrollbar-thumb:hover { background: var(--color-ink-faint); }
.reading-footer { display: flex; align-items: center; justify-content: flex-end; padding: 1.5rem 3rem 2rem; }
.reading-actions { display: flex; gap: 1.25rem; }

/* ---------- Text Buttons ---------- */
.btn-text {
  font-family: var(--font-serif); font-weight: 400; font-size: 0.9rem;
  color: var(--color-ink-soft); background: none; border: none; cursor: pointer;
  padding: 0.25rem 0; transition: color var(--dur-fast) var(--ease-out);
  letter-spacing: 0.03em; position: relative;
}
.btn-text::after {
  content: ''; position: absolute; bottom: 0; left: 0;
  width: 0; height: 1px; background: currentColor;
  transition: width var(--dur-fast) var(--ease-out);
}
.btn-text:hover { color: var(--color-ink); }
.btn-text:hover::after { width: 100%; }
.btn-text-danger { color: var(--color-danger); }
.btn-text-danger:hover { color: var(--color-danger-dim); }

/* ---------- Confirm Modal ---------- */
.modal-confirm .modal-content {
  width: 90vw; max-width: 380px; padding: 2.5rem 2rem; text-align: center; border-radius: 6px;
}
.confirm-title {
  font-family: var(--font-serif); font-weight: 500; font-size: 1.25rem;
  color: var(--color-ink); margin-bottom: 0.75rem;
}
.confirm-text {
  font-family: var(--font-cjk), var(--font-serif); font-weight: 300;
  font-size: 0.95rem; color: var(--color-ink-soft); margin-bottom: 2rem;
}
.confirm-password { margin-bottom: 1.5rem; }
.confirm-password-input {
  width: 100%; padding: 0.6rem 0.75rem; font-family: var(--font-serif);
  font-weight: 300; font-size: 0.9rem; color: var(--color-ink);
  background: transparent; border: 1px solid var(--color-rule);
  border-radius: 2px; outline: none; text-align: center;
  transition: border-color var(--dur-fast) var(--ease-out);
}
.confirm-password-input::placeholder { color: var(--color-ink-faint); font-style: italic; }
.confirm-password-input:focus { border-color: var(--color-accent); }
.confirm-actions { display: flex; justify-content: center; gap: 2rem; }

/* ---------- Memoir Toast ---------- */
.toast {
  position: fixed; bottom: 2.5rem; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--color-ink); color: var(--color-paper);
  font-family: var(--font-serif); font-weight: 300; font-size: 0.9rem;
  padding: 0.6rem 1.5rem; border-radius: 2px;
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-normal) var(--ease-out),
              transform var(--dur-normal) var(--ease-out);
  z-index: 999; letter-spacing: 0.03em;
}
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Loading Spinner ---------- */
.loader { display: flex; justify-content: center; padding: 4rem 0; }
.loader-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--color-rule);
  margin: 0 4px; animation: pulse 1.2s var(--ease-out) infinite;
}
.loader-dot:nth-child(2) { animation-delay: 0.15s; }
.loader-dot:nth-child(3) { animation-delay: 0.3s; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes pulse {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.4); }
}

/* ============================================================
   TREEHOLE (空树洞) STYLES — scoped under body[data-view="treehole"]
   ============================================================ */
body[data-view="treehole"] {
  --th-bg: #1a1c1b;
  --th-surface: #222523;
  --th-text: #ccc7bd;
  --th-text-dim: #8a887c;
  --th-accent: #c0a070;
  --th-accent-soft: rgba(192, 160, 112, 0.12);
  --th-card-white: #262926;
  --th-card-cool: #242724;
  --th-card-sage: #252825;
  --th-card-mist: #232623;
  --th-card-text: #c5c0b6;
  --th-card-time: #7a7870;
  --th-danger: #c08070;
  --th-ring-color: rgba(160, 140, 110, 0.05);

  font-family: 'Long Cang', 'Noto Serif SC', serif;
  background: var(--th-bg);
  color: var(--th-text);
  padding: 0;
}

/* Remove memoir paper texture in treehole mode */
body[data-view="treehole"]::before { display: none; }

/* Tree Rings */
.tree-rings {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; display: none;
  background:
    repeating-radial-gradient(
      ellipse at 50% 32%,
      transparent 0,
      transparent 50px,
      rgba(160, 140, 110, 0.06) 50px,
      rgba(160, 140, 110, 0.06) 51px,
      transparent 51px,
      transparent 100px,
      rgba(150, 130, 100, 0.05) 100px,
      rgba(150, 130, 100, 0.05) 101px,
      transparent 101px,
      transparent 155px,
      rgba(140, 120, 90, 0.04) 155px,
      rgba(140, 120, 90, 0.04) 156px,
      transparent 156px,
      transparent 215px,
      rgba(130, 110, 85, 0.03) 215px,
      rgba(130, 110, 85, 0.03) 216px,
      transparent 216px,
      transparent 285px,
      rgba(120, 100, 80, 0.025) 285px,
      rgba(120, 100, 80, 0.025) 286px
    );
}
body[data-view="treehole"] .tree-rings { display: block; }

/* Ambient Orbs */
.ambient-orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(120px); opacity: 0.4; display: none; }
.orb-1 { width: 380px; height: 380px; top: -10%; left: 10%; background: radial-gradient(circle, rgba(180,150,100,0.25), transparent); animation: th-drift1 30s infinite ease-in-out; }
.orb-2 { width: 300px; height: 300px; top: 50%; right: -8%; background: radial-gradient(circle, rgba(160,130,90,0.2), transparent); animation: th-drift2 24s infinite ease-in-out; }
.orb-3 { width: 340px; height: 340px; bottom: -12%; left: 25%; background: radial-gradient(circle, rgba(140,110,80,0.18), transparent); animation: th-drift3 27s infinite ease-in-out; }
body[data-view="treehole"] .ambient-orb { display: block; }

@keyframes th-drift1 {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(70px, -35px); }
  66% { transform: translate(-25px, 45px); }
}
@keyframes th-drift2 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-55px, -45px); }
}
@keyframes th-drift3 {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(45px, 25px); }
  66% { transform: translate(-35px, -55px); }
}

/* Particles */
.particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; display: none; }
body[data-view="treehole"] .particles { display: block; }
.particle {
  position: absolute; width: 2.5px; height: 2.5px; border-radius: 50%;
  background: rgba(180, 150, 100, 0.45); animation: th-float 9s infinite ease-in-out;
}
.particle:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; animation-duration: 7s; }
.particle:nth-child(2) { top: 25%; left: 75%; animation-delay: 1.2s; animation-duration: 8.5s; }
.particle:nth-child(3) { top: 60%; left: 20%; animation-delay: 2.5s; animation-duration: 9s; }
.particle:nth-child(4) { top: 70%; left: 85%; animation-delay: 0.6s; animation-duration: 7.5s; }
.particle:nth-child(5) { top: 35%; left: 45%; animation-delay: 3s; animation-duration: 10s; }
.particle:nth-child(6) { top: 80%; left: 55%; animation-delay: 1.8s; animation-duration: 8s; }
.particle:nth-child(7) { top: 10%; left: 50%; animation-delay: 4s; animation-duration: 9.5s; }
.particle:nth-child(8) { top: 45%; left: 30%; animation-delay: 2s; animation-duration: 7.8s; }

@keyframes th-float {
  0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
  20% { opacity: 0.7; }
  50% { transform: translateY(-50px) translateX(15px); opacity: 0.25; }
  80% { opacity: 0.08; }
}

/* Treehole App Container */
#treeholeView .th-app {
  position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding: 52px 24px 80px;
}

/* Treehole Header */
#treeholeView .th-header { text-align: center; margin-bottom: 36px; }
#treeholeView .th-title {
  font-family: 'Liu Jian Mao Cao', cursive; font-size: 4rem; font-weight: 400;
  letter-spacing: 0.22em; color: #d4c8a0;
  text-shadow: 0 0 60px rgba(192, 160, 112, 0.2), 0 1px 3px rgba(0,0,0,0.3);
  margin-bottom: 6px; line-height: 1.4;
}
#treeholeView .th-subtitle {

                    (cp >= 0x00C0 && cp <= 0x024F) || cp === 0x0027;
    const isDigit = cp >= 0x0030 && cp <= 0x0039;
    const isSpace = cp === 0x0020 || cp === 0x000A || cp === 0x000D || cp === 0x0009;
    if (isCJK) {
      if (inLatin && latinWord) { count++; latinWord = ''; inLatin = false; }
      count++;
    } else if (isLatin || isDigit) {
      inLatin = true; latinWord += ch;
    } else if (isSpace) {
      if (inLatin && latinWord) { count++; latinWord = ''; }
      inLatin = false;
    } else {
      if (inLatin && latinWord) { count++; latinWord = ''; }
      inLatin = false;
    }
  }
  if (inLatin && latinWord) count++;
  return count;
}

function countChars(text) {
  if (!text) return 0;
  let count = 0;
  for (const ch of text) {
    if (ch !== ' ' && ch !== '\n' && ch !== '\r' && ch !== '\t') count++;
  }
  return count;
}

function readingTime(wordCount) {
  return Math.max(1, Math.ceil(wordCount / 250));
}

function formatDate(isoString) {
  const d = new Date(isoString);
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}

function formatDateTime(isoString) {
  const d = new Date(isoString);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${hh}:${mm}`;
}

function excerpt(text, maxLen) {
  if (!text || text.length <= maxLen) return text || '';
  const slice = text.slice(0, maxLen);
  const breakIdx = Math.max(
    slice.lastIndexOf('。'), slice.lastIndexOf('！'),
    slice.lastIndexOf('？'), slice.lastIndexOf('\n'),
    slice.lastIndexOf('. '), slice.lastIndexOf('! '), slice.lastIndexOf('? ')
  );
  if (breakIdx > maxLen * 0.5) return slice.slice(0, breakIdx + 1);
  const lastSpace = slice.lastIndexOf(' ');
  if (lastSpace > maxLen * 0.5) return slice.slice(0, lastSpace);
  return slice + '…';
}

function filterEssays(essays, query) {
  if (!query || !query.trim()) return essays;
  const q = query.toLowerCase().trim();
  return essays.filter(e =>
    (e.title && e.title.toLowerCase().includes(q)) ||
    (e.content && e.content.toLowerCase().includes(q))
  );
}

function debounce(fn, delay) {
  let timer;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

/* ============================================================
   MEMOIR UI
   ============================================================ */
let modalHistoryPushed = false;

function pushModalState() {
  if (!modalHistoryPushed) {
    history.pushState({ modal: true }, '');
    modalHistoryPushed = true;
  }
}

function popModalState() {
  if (modalHistoryPushed) {
    modalHistoryPushed = false;
    history.back();
  }
}

function closeAllModals() {
  modalHistoryPushed = false;
  document.getElementById('readingModal').classList.remove('active');
  document.getElementById('writingModal').classList.remove('active');
  document.getElementById('confirmModal').classList.remove('active');
  document.getElementById('overlay').classList.remove('active');
  document.body.style.overflow = '';
  delete document.getElementById('writingModal').dataset.editId;
  delete document.getElementById('confirmModal').dataset.essayId;
}

window.addEventListener('popstate', () => {
  if (modalHistoryPushed) closeAllModals();
});

function renderEssayList(essays) {
  const container = document.getElementById('essayList');
  const emptyState = document.getElementById('emptyState');
  container.innerHTML = '';
  if (!essays || essays.length === 0) {
    container.style.display = 'none';
    emptyState.style.display = 'block';
    return;
  }
  container.style.display = 'block';
  emptyState.style.display = 'none';
  essays.forEach((essay, idx) => {
    const card = createEssayEntry(essay, idx);
    container.appendChild(card);
  });
}

function createEssayEntry(essay, index) {
  const entry = document.createElement('article');
  entry.className = 'essay-entry';
  entry.style.animationDelay = `${index * 60}ms`;
  entry.dataset.id = essay.id;
  const title = essay.title && essay.title.trim() ? essay.title.trim() : '无标题';
  const titleClass = title === '无标题' ? 'untitled' : '';
  const excerptText = excerpt(essay.content, 150);
  entry.innerHTML = `
    <h3 class="essay-entry-title ${titleClass}">${escapeHTML(title)}</h3>
    ${excerptText ? `<p class="essay-entry-excerpt">${escapeHTML(excerptText)}</p>` : ''}
  `;
  entry.addEventListener('click', () => showReadingModal(essay));
  return entry;
}

function showReadingModal(essay) {
  document.getElementById('readingTitle').textContent =
    essay.title && essay.title.trim() ? essay.title.trim() : '无标题';
  document.getElementById('readingBody').textContent = essay.content;
  document.getElementById('readingModal').classList.add('active');
  document.getElementById('overlay').classList.add('active');
  document.body.style.overflow = 'hidden';
  document.getElementById('readingModal').dataset.essayId = essay.id;
  document.getElementById('readingModal').dataset.essayTitle = essay.title || '';
  document.getElementById('readingModal').dataset.essayContent = essay.content || '';
  pushModalState();
}

function hideReadingModal() {
  document.getElementById('readingModal').classList.remove('active');
  document.getElementById('overlay').classList.remove('active');
  document.body.style.overflow = '';
  popModalState();
}

function closeReadingModalSilent() {
  document.getElementById('readingModal').classList.remove('active');
  document.getElementById('overlay').classList.remove('active');
  modalHistoryPushed = false;
}

function showWritingModal(essay) {
  const titleInput = document.getElementById('essayTitle');
  const contentInput = document.getElementById('essayContent');
  if (essay) {
    titleInput.value = essay.title || document.getElementById('readingModal').dataset.essayTitle || '';
    contentInput.value = essay.content || document.getElementById('readingModal').dataset.essayContent || '';
    document.getElementById('writingModal').dataset.editId = essay.id || document.getElementById('readingModal').dataset.essayId || '';
  } else {
    titleInput.value = '';
    contentInput.value = '';
    delete document.getElementById('writingModal').dataset.editId;
  }
  updateWritingMetadata();
  document.getElementById('writingModal').classList.add('active');
  document.getElementById('overlay').classList.add('active');
  document.body.style.overflow = 'hidden';
  pushModalState();
  setTimeout(() => contentInput.focus(), 150);
}

function hideWritingModal() {
  document.getElementById('writingModal').classList.remove('active');
  document.getElementById('overlay').classList.remove('active');
  document.body.style.overflow = '';
  delete document.getElementById('writingModal').dataset.editId;
  popModalState();
}

function updateWritingMetadata() {
  const title = document.getElementById('essayTitle').value || '';
  const content = document.getElementById('essayContent').value || '';
  const fullText = title + '\n' + content;
  const wc = countWords(fullText);
  const cc = countChars(fullText);
  document.getElementById('writingMeta').innerHTML = `
    <span class="meta-item">${cc.toLocaleString()} 字符</span>
    <span class="meta-sep">·</span>
    <span class="meta-item">${wc.toLocaleString()} 词</span>
  `;
}

function showConfirmModal(essayId) {
  document.getElementById('confirmModal').dataset.essayId = essayId;
  document.getElementById('confirmModal').classList.add('active');
  document.getElementById('overlay').classList.add('active');
  document.getElementById('deletePassword').value = '';
  pushModalState();
}

function hideConfirmModal() {
  document.getElementById('confirmModal').classList.remove('active');
  document.getElementById('overlay').classList.remove('active');
  document.body.style.overflow = '';
  delete document.getElementById('confirmModal').dataset.essayId;
  popModalState();
}

let memoirToastTimer;
function showMemoirToast(message, duration) {
  duration = duration || 2200;
  const toast = document.getElementById('toast');
  clearTimeout(memoirToastTimer);
  toast.textContent = message;
  toast.classList.add('visible');
  memoirToastTimer = setTimeout(() => toast.classList.remove('visible'), duration);
}

function showLoading() {
  const container = document.getElementById('essayList');
  container.innerHTML = `
    <div class="loader">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
  `;
  container.style.display = 'block';
  document.getElementById('emptyState').style.display = 'none';
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ============================================================
   MEMOIR APP CONTROLLER
   ============================================================ */
let essays = [];

async function memoirInit() {
  showLoading();
  try {
    essays = await fetchEssays();
    renderEssayList(essays);
  } catch (err) {
    console.error('Failed to load essays:', err);
    showMemoirToast('失败');
    document.getElementById('essayList').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
  }
  memoirBindEvents();
}

function memoirBindEvents() {
  document.getElementById('newEssayBtn').addEventListener('click', () => showWritingModal(null));
  document.getElementById('saveEssay').addEventListener('click', handleSave);
  document.getElementById('cancelWriting').addEventListener('click', hideWritingModal);
  document.getElementById('essayContent').addEventListener('input', updateWritingMetadata);
  document.getElementById('essayTitle').addEventListener('input', updateWritingMetadata);
  document.getElementById('closeReading').addEventListener('click', hideReadingModal);
  document.getElementById('editEssay').addEventListener('click', () => {
    const modal = document.getElementById('readingModal');
    const essay = {
      id: modal.dataset.essayId,
      title: modal.dataset.essayTitle,
      content: modal.dataset.essayContent
    };
    closeReadingModalSilent();
    showWritingModal(essay);
  });
  document.getElementById('deleteEssay').addEventListener('click', () => {
    const essayId = document.getElementById('readingModal').dataset.essayId;
    closeReadingModalSilent();
    showConfirmModal(essayId);
  });
  document.getElementById('confirmDelete').addEventListener('click', handleDelete);
  document.getElementById('cancelDelete').addEventListener('click', hideConfirmModal);
  document.getElementById('overlay').addEventListener('click', () => {
    if (document.getElementById('writingModal').classList.contains('active')) hideWritingModal();
    if (document.getElementById('readingModal').classList.contains('active')) hideReadingModal();
    if (document.getElementById('confirmModal').classList.contains('active')) hideConfirmModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (document.getElementById('confirmModal').classList.contains('active')) hideConfirmModal();
      else if (document.getElementById('writingModal').classList.contains('active')) hideWritingModal();
      else if (document.getElementById('readingModal').classList.contains('active')) hideReadingModal();
    }
  });
  const searchInput = document.getElementById('searchInput');
  const debouncedFilter = debounce(() => {
    const query = searchInput.value;
    const filtered = filterEssays(essays, query);
    renderEssayList(filtered);
  }, 200);
  searchInput.addEventListener('input', debouncedFilter);
}

async function handleSave() {
  const titleInput = document.getElementById('essayTitle');
  const contentInput = document.getElementById('essayContent');
  const title = titleInput.value.trim();
  const content = contentInput.value;
  if (!content.trim()) { showMemoirToast('请输入内容'); contentInput.focus(); return; }
  const fullText = title + '\n' + content;
  const wordCount = countWords(fullText);
  const charCount = countChars(fullText);
  const editId = document.getElementById('writingModal').dataset.editId;
  const saveBtn = document.getElementById('saveEssay');
  const originalText = saveBtn.textContent;
  saveBtn.textContent = '保存中...';
  saveBtn.style.pointerEvents = 'none';
  saveBtn.style.opacity = '0.6';
  try {
    if (editId) { await updateEssay(editId, { title, content, wordCount, charCount }); showMemoirToast('已更新'); }
    else { await saveEssay({ title, content, wordCount, charCount }); showMemoirToast('已保存'); }
    hideWritingModal();
    showLoading();
    essays = await fetchEssays();
    renderEssayList(essays);
  } catch (err) {
    console.error('Save failed:', err);
    showMemoirToast('保存失败，请重试');
  } finally {
    saveBtn.textContent = originalText;
    saveBtn.style.pointerEvents = '';
    saveBtn.style.opacity = '';
  }
}

async function handleDelete() {
  const essayId = document.getElementById('confirmModal').dataset.essayId;
  if (!essayId) return;
  const passwordInput = document.getElementById('deletePassword');
  if (passwordInput.value !== 'woshisb') { showMemoirToast('删除失败'); return; }
  const confirmBtn = document.getElementById('confirmDelete');
  const originalText = confirmBtn.textContent;
  confirmBtn.textContent = '删除中...';
  confirmBtn.style.pointerEvents = 'none';
  try {
    await deleteEssay(essayId);
    showMemoirToast('已删除');
    hideConfirmModal();
    showLoading();
    essays = await fetchEssays();
    renderEssayList(essays);
  } catch (err) {
    console.error('Delete failed:', err);
    showMemoirToast('删除失败，请重试');
  } finally {
    confirmBtn.textContent = originalText;
    confirmBtn.style.pointerEvents = '';
  }
}

    const min = Math.floor(sec / 60);

  document.addEventListener('click', function(e) {
    if (thPendingDeleteId && !e.target.closest('.th-entry-delete')) thResetDeleteButton(thPendingDeleteId);
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && thPendingDeleteId) thResetDeleteButton(thPendingDeleteId);
  });

  /* Treehole Init */
  async function thInit() {
    await thLoad();
    thRender();
  }

  thInit();
})();

/* ============================================================
   VIEW SWITCHING LOGIC
   ============================================================ */
(function() {
  var body = document.body;
  var switchToTreehole = document.getElementById('switchToTreehole');
  var switchToMemoir = document.getElementById('switchToMemoir');
  var newEssayBtn = document.getElementById('newEssayBtn');

  switchToTreehole.addEventListener('click', function() {
    body.setAttribute('data-view', 'treehole');
    switchToTreehole.style.display = 'none';
    switchToMemoir.style.display = 'flex';
  });

  switchToMemoir.addEventListener('click', function() {
    body.setAttribute('data-view', 'memoir');
    switchToMemoir.style.display = 'none';
    switchToTreehole.style.display = 'flex';
  });
})();

/* ============================================================
   MEMOIR INIT (on DOMContentLoaded)
   ============================================================ */
document.addEventListener('DOMContentLoaded', memoirInit);
</script>
</body>
</html>
